<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-surface": "#e5e1e4", "tertiary-container": "#7c87f3", "surface-tint": "#adc6ff", "primary-fixed": "#d8e2ff", "surface": "#131315", "secondary-fixed": "#d4e3ff", "on-tertiary": "#131e8c", "outline-variant": "#424754", "secondary": "#a4c9ff", "on-tertiary-container": "#081486", "on-surface-variant": "#c2c6d6", "on-tertiary-fixed-variant": "#2f3aa3", "on-secondary-fixed-variant": "#004883", "primary-container": "#4d8eff", "on-primary": "#002e6a", "outline": "#8c909f", "background": "#131315", "on-surface": "#e5e1e4", "error-container": "#93000a", "on-error-container": "#ffdad6", "surface-container-lowest": "#0e0e10", "on-secondary-container": "#d6e5ff", "surface-container-high": "#2a2a2c", "surface-dim": "#131315", "inverse-primary": "#005ac2", "primary": "#adc6ff", "on-primary-fixed": "#001a42", "on-tertiary-fixed": "#000767", "secondary-container": "#0267b8", "on-secondary-fixed": "#001c39", "error": "#ffb4ab", "tertiary-fixed": "#e0e0ff", "on-secondary": "#00315d", "surface-container": "#1f1f21", "primary-fixed-dim": "#adc6ff", "on-primary-container": "#00285d", "surface-bright": "#39393b", "tertiary-fixed-dim": "#bdc2ff", "inverse-on-surface": "#303032", "on-primary-fixed-variant": "#004395", "secondary-fixed-dim": "#a4c9ff", "on-background": "#e5e1e4", "surface-variant": "#353437", "surface-container-highest": "#353437", "surface-container-low": "#1b1b1d", "tertiary": "#bdc2ff", "on-error": "#690005" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "gutter": "1rem", "space-xl": "1.5rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-lg": "1rem", "space-md": "0.75rem", "margin": "1rem" }, fontFamily: { "label-sm": ["Inter"], "label-lg": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "code-md": ["JetBrains Mono"], "body-md": ["Inter"] }, fontSize: { "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }], "headline-lg": ["30px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "26px", letterSpacing: "-0.005em", fontWeight: "400" }], "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }], "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }], "headline-sm": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "code-md": ["13px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }], "body-md": ["15px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }] } } } };</script><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:max(env(safe-area-inset-bottom,0px),8px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background text-on-surface font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-background"><div class="flex flex-col w-full relative px-gutter pb-6 select-none overflow-hidden justify-between">
<!-- Dynamic Ambient Glow Backdrop (Hardware-accelerated CSS Pulse) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center -z-10">
<div class="w-80 h-80 rounded-full bg-gradient-to-tr from-tertiary-container/20 via-primary-container/25 to-secondary-container/10 blur-3xl transform scale-125 transition-transform duration-1000 ease-out" id="ambient-radial-glow"></div>
</div>
<!-- Top Action & Status Bar -->
<header class="w-full flex items-center justify-between pt-2 z-10">
<!-- Minimize / Dismiss Call -->
<button aria-label="Minimize Call" class="w-11 h-11 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 transition flex items-center justify-center text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">keyboard_arrow_down</span>
</button>
<!-- Center Call Status & Running Clock -->
<div class="flex flex-col items-center justify-center">
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-primary-container animate-ping"></span>
<span class="font-label-md text-label-md text-primary" id="call-state-label">Listening...</span>
</div>
<span class="font-label-sm text-label-sm text-outline tracking-wider" id="call-timer">01:42</span>
</div>
<!-- Voice Model Selector Pill -->
<button class="h-9 px-3 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 transition flex items-center space-x-1 text-on-surface" id="model-selector-btn" type="button">
<span class="font-label-md text-label-md text-on-surface-variant font-medium">Breeze</span>
<span class="material-symbols-outlined text-[16px] text-outline">expand_more</span>
</button>
</header>
<!-- Central Visualizer & Dynamic Interactive Orb -->
<div class="flex flex-col items-center justify-center my-auto py-8 z-10">
<!-- Fluid Ethereal AI Orb Stage -->
<div class="relative w-64 h-64 flex items-center justify-center" id="voice-orb-container">
<!-- Outer Soundwave Pulse Rings -->
<div class="absolute inset-0 rounded-full border border-primary/20 scale-110 animate-pulse duration-1000 opacity-60"></div>
<div class="absolute -inset-4 rounded-full border border-tertiary/15 scale-125 duration-1000 opacity-40"></div>
<div class="absolute -inset-8 rounded-full border border-secondary-container/10 scale-150 duration-700 opacity-20"></div>
<!-- Organic Multi-stop Gradient Core -->
<div class="w-44 h-44 rounded-full shadow-2xl relative overflow-hidden flex items-center justify-center transition-all duration-300 transform scale-100" id="orb-core" style="background: radial-gradient(circle at 35% 35%, #adc6ff 0%, #4d8eff 38%, #7c87f3 72%, #0e0e10 100%);">
<!-- Surface Plasma Caustics -->
<div class="absolute inset-0 mix-blend-screen opacity-70 bg-gradient-to-tr from-secondary-fixed/40 via-transparent to-primary/30"></div>
<div class="w-32 h-32 rounded-full bg-gradient-to-bl from-tertiary/60 to-transparent blur-md transform -rotate-45 animate-spin duration-1000"></div>
<!-- Inner Specular Core Reflection -->
<div class="w-16 h-16 rounded-full bg-surface-container-lowest/20 backdrop-blur-sm border border-surface-tint/30 flex items-center justify-center">
<div class="w-6 h-6 rounded-full bg-white/70 blur-xs"></div>
</div>
</div>
<!-- Reactive Frequency Particle Node Points (SVG) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 256 256">
<circle class="fill-primary animate-pulse" cx="128" cy="18" r="2.5"></circle>
<circle class="fill-tertiary" cx="238" cy="128" r="2"></circle>
<circle class="fill-secondary opacity-60" cx="128" cy="238" r="3"></circle>
<circle class="fill-primary-container" cx="24" cy="116" r="2"></circle>
</svg>
</div>
<!-- Live Dual-channel Transcription Feed -->
<div class="mt-8 max-w-xs text-center flex flex-col items-center">
<p class="font-body-md text-body-md text-on-surface font-normal leading-relaxed transition-all duration-200" id="live-transcription">
        “Can you explain the difference between optimistic concurrency and pessimistic locking?”
      </p>
<!-- Connection Mode / Latency Pill -->
<div class="mt-4 inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-surface-container-low">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Ambient Voice • 42ms Ultra Low Latency</span>
</div>
</div>
</div>
<!-- Bottom Ergonomic Floating Controls & Utility Hub -->
<footer class="w-full flex flex-col items-center z-10 gap-y-4">
<!-- Primary Thumb-zone Controls Panel -->
<div class="w-full flex items-center justify-between px-4 max-w-sm">
<!-- Audio Destination Selector (Speaker / Earpiece / Bluetooth) -->
<button aria-label="Toggle Audio Output" class="w-14 h-14 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-90 transition flex flex-col items-center justify-center text-on-surface shadow-sm" id="btn-audio-route" type="button">
<span class="material-symbols-outlined text-[24px]">volume_up</span>
<span class="font-label-sm text-label-sm text-outline mt-0.5">Device</span>
</button>
<!-- Center Mic Mute / Unmute Interactive Toggle -->
<div class="relative flex items-center justify-center">
<!-- Live Voice Ring Aura -->
<span class="absolute w-20 h-20 rounded-full bg-primary-container/20 animate-ping pointer-events-none" id="mic-pulse-ring"></span>
<button aria-label="Mute Microphone" class="relative w-18 h-18 p-4 rounded-full bg-primary-container text-on-primary-container active:scale-95 transition-all duration-200 flex items-center justify-center shadow-lg" id="btn-mic-toggle" type="button">
<span class="material-symbols-outlined text-[30px]" id="mic-icon" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- End Call Destructive Button -->
<button aria-label="End Voice Session" class="w-14 h-14 rounded-full bg-error-container hover:opacity-90 active:scale-90 transition flex items-center justify-center text-on-error-container shadow-md" id="btn-end-call" type="button">
<span class="material-symbols-outlined text-[26px] transform rotate-[135deg]" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
</div>
<!-- Transcript Pull Drawer Sheet Handle -->
<div class="w-full flex flex-col items-center justify-center pt-2 cursor-pointer group" id="transcript-drawer-trigger">
<div class="w-10 h-1 rounded-full bg-outline-variant group-hover:bg-outline transition-colors"></div>
<span class="font-label-sm text-label-sm text-outline mt-1 flex items-center gap-1 group-hover:text-on-surface-variant transition-colors">
        Full transcript
        <span class="material-symbols-outlined text-[14px]">expand_less</span>
</span>
</div>
</footer>
</div>
<script>
  (function() {
    // Reactive Audio Simulation Engine
    const orb = document.getElementById('orb-core');
    const glow = document.getElementById('ambient-radial-glow');
    const micBtn = document.getElementById('btn-mic-toggle');
    const micIcon = document.getElementById('mic-icon');
    const micRing = document.getElementById('mic-pulse-ring');
    const timerLabel = document.getElementById('call-timer');
    const stateLabel = document.getElementById('call-state-label');
    const transcription = document.getElementById('live-transcription');
    
    let isMuted = false;
    let seconds = 102;

    // Organic Breath & Amplitude Motion Loop
    let phase = 0;
    function animateFluidOrb() {
      if (!isMuted) {
        phase += 0.05;
        const amplitude = Math.sin(phase) * 0.08 + 1;
        const ambientScale = 1.1 + Math.cos(phase * 0.8) * 0.15;
        orb.style.transform = `scale(${amplitude})`;
        glow.style.transform = `scale(${ambientScale})`;
      }
      requestAnimationFrame(animateFluidOrb);
    }
    animateFluidOrb();

    // Call Duration Tracker
    setInterval(() => {
      seconds++;
      const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      timerLabel.textContent = `${mins}:${secs}`;
    }, 1000);

    // Dynamic Mic Toggle Interaction
    micBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        micBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
        micBtn.classList.add('bg-surface-container-high', 'text-outline');
        micIcon.textContent = 'mic_off';
        micRing.classList.add('hidden');
        stateLabel.textContent = 'Microphone Muted';
        stateLabel.classList.remove('text-primary');
        stateLabel.classList.add('text-outline');
        orb.style.transform = 'scale(0.88)';
        glow.style.transform = 'scale(0.8)';
        glow.style.opacity = '0.3';
      } else {
        micBtn.classList.add('bg-primary-container', 'text-on-primary-container');
        micBtn.classList.remove('bg-surface-container-high', 'text-outline');
        micIcon.textContent = 'mic';
        micRing.classList.remove('hidden');
        stateLabel.textContent = 'Listening...';
        stateLabel.classList.add('text-primary');
        stateLabel.classList.remove('text-outline');
        glow.style.opacity = '1';
      }
    });

    // Model Selector Switcher Micro-Feedback
    const modelBtn = document.getElementById('model-selector-btn');
    const voices = ['Breeze (Female)', 'Cove (Male)', 'Juniper (Warm)', 'Ember (Calm)'];
    let voiceIdx = 0;
    modelBtn.addEventListener('click', () => {
      voiceIdx = (voiceIdx + 1) % voices.length;
      modelBtn.querySelector('span:first-child').textContent = voices[voiceIdx].split(' ')[0];
    });

    // Audio Output Switcher Feedback
    const audioRouteBtn = document.getElementById('btn-audio-route');
    const routes = [
      { label: 'Device', icon: 'volume_up' },
      { label: 'Ear', icon: 'phone_in_talk' },
      { label: 'BT Pixel', icon: 'bluetooth_audio' }
    ];
    let routeIdx = 0;
    audioRouteBtn.addEventListener('click', () => {
      routeIdx = (routeIdx + 1) % routes.length;
      audioRouteBtn.querySelector('.material-symbols-outlined').textContent = routes[routeIdx].icon;
      audioRouteBtn.querySelector('span:last-child').textContent = routes[routeIdx].label;
    });

    // End Call Session Simulator
    document.getElementById('btn-end-call').addEventListener('click', () => {
      stateLabel.textContent = 'Call Ended';
      transcription.textContent = 'Session saved to conversation history.';
      orb.style.filter = 'grayscale(100%)';
      orb.style.transform = 'scale(0.75)';
      glow.style.opacity = '0';
    });
  })();
</script><div class="fixed bottom-0 inset-x-0 pointer-events-none flex justify-center pb-2"><div class="w-28 h-1 rounded-full bg-outline-variant/60"></div></div></main></body></html>
